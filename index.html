<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Happy Birthday Syahaarah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background-color: #f6eef1;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f6eef1;
      cursor: pointer;
      user-select: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    .tap-badge {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.78);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .tap-badge.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="screenArea" class="screen" role="button" tabindex="0" aria-label="Ketuk layar untuk memutar atau menjeda video">
    <video
      id="birthdayVideo"
      src="birthday.mp4"
      loop
      playsinline
      webkit-playsinline
      preload="metadata"
    ></video>
  </div>

  <div id="tapBadge" class="tap-badge">KETUK LAYAR CUPIWKU SAYANG</div>

  <script>
    const screenArea = document.getElementById("screenArea");
    const video = document.getElementById("birthdayVideo");
    const tapBadge = document.getElementById("tapBadge");

    let hasStartedOnce = false;

    function updateBadge() {
      if (!video.paused) {
        tapBadge.classList.add("hidden");
      } else {
        tapBadge.textContent = hasStartedOnce ? "KETUK LAYAR CUPIWKU SAYANG" : "KETUK LAYAR CUPIWKU SAYANG";
        tapBadge.classList.remove("hidden");
      }
    }

    async function handleScreenTap() {
      if (video.paused) {
        video.muted = false;
        try {
          await video.play();
          hasStartedOnce = true;
        } catch (_) {
          video.muted = true;
          try {
            await video.play();
            hasStartedOnce = true;
          } catch (__) {}
        }
      } else {
        video.pause();
      }
      updateBadge();
    }

    screenArea.addEventListener("click", handleScreenTap);
    video.addEventListener("play", updateBadge);
    video.addEventListener("pause", updateBadge);

    updateBadge();
  </script>
</body>
</html>
