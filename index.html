<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Syahaarah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #120c10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #120c10;
      overflow: hidden;
    }

    @media (min-width: 521px) {
      .player-wrapper {
        height: 96vh;
        width: auto;
        aspect-ratio: 9 / 16;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Sembunyikan kontrol bawaan browser agar layar lebih bersih */
    video::-webkit-media-controls {
      display: none !important;
    }

    .sound-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.72);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    .sound-btn:hover {
      background: rgba(35, 35, 35, 0.88);
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <video
      id="birthdayVideo"
      src="birthday.mp4"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>
  </div>

  <button id="soundToggle" class="sound-btn" type="button" aria-label="Nyalakan atau matikan suara">
    <span id="soundIcon">🔇</span>
    <span id="soundText">Tap for Sound</span>
  </button>

  <script>
    const video = document.getElementById("birthdayVideo");
    const soundBtn = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundText = document.getElementById("soundText");

    let soundUnlocked = false;

    function updateButtonUI() {
      if (video.muted) {
        soundIcon.textContent = "🔇";
        soundText.textContent = "Tap for Sound";
      } else {
        soundIcon.textContent = "🔊";
        soundText.textContent = "Sound On";
      }
    }

    async function ensureMutedAutoplay() {
      video.muted = true;
      try {
        await video.play();
      } catch (err) {
        // Akan diputar saat ada interaksi pengguna
      }
      updateButtonUI();
    }

    async function enableSoundNow() {
      video.muted = false;
      try {
        await video.play();
        soundUnlocked = true;
      } catch (err) {
        // Jika browser tetap menolak unmute pada event tertentu, tetap lanjutkan playback
        try {
          await video.play();
        } catch (_) {}
      }
      updateButtonUI();
    }

    // Sentuhan pertama di mana saja pada layar langsung menyalakan suara
    function onAnyFirstGesture(event) {
      if (soundUnlocked) return;
      if (soundBtn.contains(event.target)) return;
      enableSoundNow();
    }

    document.addEventListener("pointerdown", onAnyFirstGesture, { passive: true });
    document.addEventListener("touchstart", onAnyFirstGesture, { passive: true });

    // Tombol sudut kanan bawah untuk toggle mute/unmute
    soundBtn.addEventListener("click", async (event) => {
      event.stopPropagation();
      if (video.muted) {
        await enableSoundNow();
      } else {
        video.muted = true;
        updateButtonUI();
      }
    });

    // Setelah suara aktif, tap area video untuk pause/play
    video.addEventListener("click", async () => {
      if (!soundUnlocked) {
        await enableSoundNow();
        return;
      }
      if (video.paused) {
        try {
          await video.play();
        } catch (_) {}
      } else {
        video.pause();
      }
    });

    window.addEventListener("load", ensureMutedAutoplay);
    document.addEventListener("DOMContentLoaded", ensureMutedAutoplay);
  </script>
</body>
</html>
