<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Syahaarah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #120c10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      position: relative;
    }

    /* Menjaga rasio 9:16 utuh tanpa memotong bagian tepi video di layar mana pun */
    .player-wrapper {
      position: relative;
      aspect-ratio: 9 / 16;
      width: min(100vw, calc(100vh * 9 / 16));
      height: min(100vh, calc(100vw * 16 / 9));
      background-color: #120c10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @media (min-width: 600px) {
      .player-wrapper {
        width: min(92vw, calc(94vh * 9 / 16));
        height: min(94vh, calc(92vw * 16 / 9));
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    /* Indikator loading ringan saat video sedang memuat frame pertama */
    .loading-badge {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.72);
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .loading-badge.hidden {
      opacity: 0;
    }

    .sound-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.72);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    .sound-btn:hover {
      background: rgba(35, 35, 35, 0.88);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="player-wrapper">
      <video
        id="birthdayVideo"
        src="birthday.mp4"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        preload="auto"
      ></video>
    </div>
  </div>

  <div id="loadingBadge" class="loading-badge">Memuat video...</div>

  <button id="soundToggle" class="sound-btn" type="button" aria-label="Nyalakan atau matikan suara">
    <span id="soundIcon">🔇</span>
    <span id="soundText">Tap for Sound</span>
  </button>

  <script>
    const video = document.getElementById("birthdayVideo");
    const soundBtn = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundText = document.getElementById("soundText");
    const loadingBadge = document.getElementById("loadingBadge");

    let soundUnlocked = false;

    function updateButtonUI() {
      if (video.muted) {
        soundIcon.textContent = "🔇";
        soundText.textContent = "Tap for Sound";
      } else {
        soundIcon.textContent = "🔊";
        soundText.textContent = "Sound On";
      }
    }

    function hideLoading() {
      loadingBadge.classList.add("hidden");
    }

    function showLoading() {
      loadingBadge.classList.remove("hidden");
    }

    async function ensureMutedAutoplay() {
      video.muted = true;
      try {
        await video.play();
      } catch (err) {
        // Akan berjalan saat interaksi pertama pengguna
      }
      updateButtonUI();
    }

    async function enableSoundNow() {
      video.muted = false;
      try {
        await video.play();
        soundUnlocked = true;
      } catch (err) {
        try {
          await video.play();
        } catch (_) {}
      }
      updateButtonUI();
    }

    function onAnyFirstGesture(event) {
      if (soundUnlocked) return;
      if (soundBtn.contains(event.target)) return;
      enableSoundNow();
    }

    document.addEventListener("pointerdown", onAnyFirstGesture, { passive: true });
    document.addEventListener("touchstart", onAnyFirstGesture, { passive: true });

    soundBtn.addEventListener("click", async (event) => {
      event.stopPropagation();
      if (video.muted) {
        await enableSoundNow();
      } else {
        video.muted = true;
        updateButtonUI();
      }
    });

    video.addEventListener("click", async () => {
      if (!soundUnlocked) {
        await enableSoundNow();
        return;
      }
      if (video.paused) {
        try {
          await video.play();
        } catch (_) {}
      } else {
        video.pause();
      }
    });

    // Kelola status indikator loading agar pengguna tahu video sedang siap
    video.addEventListener("loadeddata", hideLoading);
    video.addEventListener("canplay", hideLoading);
    video.addEventListener("playing", hideLoading);
    video.addEventListener("waiting", showLoading);

    window.addEventListener("load", ensureMutedAutoplay);
    document.addEventListener("DOMContentLoaded", ensureMutedAutoplay);
  </script>
</body>
</html>
