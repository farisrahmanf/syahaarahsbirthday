<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Syahaarah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #120c10;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      aspect-ratio: 9 / 16;
      background-color: #000;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }

    @media (min-width: 481px) {
      .player-wrapper {
        height: 94vh;
        width: auto;
        border-radius: 20px;
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Sembunyikan kontrol bawaan browser agar tampilan lebih bersih */
    video::-webkit-media-controls {
      display: none !important;
    }

    .sound-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: rgba(20, 20, 20, 0.72);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    .sound-btn:hover {
      background: rgba(35, 35, 35, 0.88);
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <!-- Pastikan nama file video sama persis dengan yang ada di repository -->
    <video
      id="birthdayVideo"
      src="birthday.mp4"
      autoplay
      loop
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <button id="soundToggle" class="sound-btn" type="button" aria-label="Nyalakan atau matikan suara">
    <span id="soundIcon">🔇</span>
    <span id="soundText">Tap for Sound</span>
  </button>

  <script>
    const video = document.getElementById("birthdayVideo");
    const soundBtn = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundText = document.getElementById("soundText");

    let firstInteractionDone = false;

    function updateButtonUI() {
      if (video.muted) {
        soundIcon.textContent = "🔇";
        soundText.textContent = "Tap for Sound";
      } else {
        soundIcon.textContent = "🔊";
        soundText.textContent = "Sound On";
      }
    }

    async function unmuteAndPlay() {
      video.muted = false;
      try {
        await video.play();
      } catch (err) {
        console.log("Playback error:", err);
      }
      updateButtonUI();
    }

    // Sentuhan/klik pertama di mana saja pada layar langsung menyalakan suara
    async function handleFirstInteraction(event) {
      if (firstInteractionDone) return;
      firstInteractionDone = true;

      // Jika yang diklik bukan tombol soundToggle, langsung nyalakan suara
      if (!soundBtn.contains(event.target)) {
        await unmuteAndPlay();
      }
    }

    document.addEventListener("pointerdown", handleFirstInteraction, { once: true });

    // Klik tombol soundToggle untuk toggle mute/unmute kapan saja
    soundBtn.addEventListener("click", async (event) => {
      event.stopPropagation();
      firstInteractionDone = true;
      video.muted = !video.muted;
      if (!video.muted) {
        try {
          await video.play();
        } catch (err) {
          console.log("Playback error:", err);
        }
      }
      updateButtonUI();
    });

    // Tap area video setelah interaksi pertama untuk pause/play
    video.addEventListener("click", async () => {
      if (!firstInteractionDone) return;
      if (video.paused) {
        try {
          await video.play();
        } catch (err) {
          console.log("Play error:", err);
        }
      } else {
        video.pause();
      }
    });

    // Mulai autoplay dalam mode muted saat halaman dimuat
    window.addEventListener("load", async () => {
      try {
        await video.play();
      } catch (err) {
        console.log("Autoplay muted fallback:", err);
      }
      updateButtonUI();
    });
  </script>
</body>
</html>
