<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Happy Birthday Syahaarah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      background-color: #f6eef1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .stage {
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .player-wrapper {
      position: relative;
      aspect-ratio: 9 / 16;
      width: min(100vw, calc(100dvh * 9 / 16));
      height: min(100dvh, calc(100vw * 16 / 9));
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #f6eef1;
    }

    @media (min-width: 640px) {
      body {
        background-color: #161114;
      }
      .player-wrapper {
        width: min(92vw, calc(92dvh * 9 / 16));
        height: min(92dvh, calc(92vw * 16 / 9));
        border-radius: 22px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      }
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    video::-webkit-media-controls {
      display: none !important;
    }

    .sound-btn {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      right: 18px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 15px;
      border: none;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.82);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      transition: transform 0.14s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.95);
    }

    .sound-hint {
      position: fixed;
      bottom: calc(64px + env(safe-area-inset-bottom));
      right: 18px;
      z-index: 25;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(24, 24, 24, 0.65);
      color: #ffffff;
      font-size: 11px;
      font-weight: 500;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sound-hint.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="player-wrapper">
      <video
        id="birthdayVideo"
        src="birthday.mp4"
        autoplay
        loop
        muted
        playsinline
        webkit-playsinline
        preload="metadata"
      ></video>
    </div>
  </div>

  <div id="soundHint" class="sound-hint">Ketuk layar untuk suara</div>

  <button id="soundToggle" class="sound-btn" type="button" aria-label="Nyalakan atau matikan suara">
    <span id="soundIcon">🔇</span>
    <span id="soundText">Tap for Sound</span>
  </button>

  <script>
    const video = document.getElementById("birthdayVideo");
    const soundBtn = document.getElementById("soundToggle");
    const soundIcon = document.getElementById("soundIcon");
    const soundText = document.getElementById("soundText");
    const soundHint = document.getElementById("soundHint");

    let userInteracted = false;

    function syncUI() {
      if (video.muted) {
        soundIcon.textContent = "🔇";
        soundText.textContent = "Tap for Sound";
      } else {
        soundIcon.textContent = "🔊";
        soundText.textContent = "Sound On";
        soundHint.classList.add("hidden");
      }
    }

    async function startMutedPlayback() {
      video.muted = true;
      try {
        await video.play();
      } catch (_) {}
      syncUI();
    }

    async function unmuteAndPlay() {
      video.muted = false;
      userInteracted = true;
      try {
        await video.play();
      } catch (_) {
        video.muted = true;
        try {
          await video.play();
        } catch (__) {}
      }
      syncUI();
    }

    // Sentuhan pertama di area mana pun langsung menyalakan suara
    function handleFirstTap(e) {
      if (userInteracted) return;
      if (soundBtn.contains(e.target)) return;
      unmuteAndPlay();
    }

    document.addEventListener("pointerdown", handleFirstTap, { passive: true });
    document.addEventListener("touchstart", handleFirstTap, { passive: true });

    soundBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (video.muted) {
        await unmuteAndPlay();
      } else {
        video.muted = true;
        syncUI();
      }
    });

    // Jika setelah unmute pengguna mengetuk layar lagi, toggle play/pause
    document.addEventListener("click", async (e) => {
      if (!userInteracted) return;
      if (soundBtn.contains(e.target)) return;
      if (video.paused) {
        try {
          await video.play();
        } catch (_) {}
      } else {
        video.pause();
      }
    });

    // Pastikan video langsung jalan saat dibuka / kembali aktif dari scanner QR
    ["DOMContentLoaded", "load", "pageshow", "canplay"].forEach((evt) => {
      window.addEventListener(evt, () => {
        if (!userInteracted) {
          startMutedPlayback();
        } else if (video.paused) {
          video.play().catch(() => {});
        }
      });
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && video.paused) {
        video.play().catch(() => {});
      }
    });

    syncUI();
  </script>
</body>
</html>
